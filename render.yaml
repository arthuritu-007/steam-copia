services:
  # Backend
  - type: web
    name: steam-copia-backend
    env: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: APP_SEED
        value: "true"
      - key: JWT_SECRET
        value: CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_123456
      - key: JAVA_VERSION
        value: 17

  # Frontend (Static Site)
  - type: static
    name: steam-copia-frontend
    buildCommand: bash build.sh
    staticPublishPath: frontend/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://steam-copia-backend.onrender.com
