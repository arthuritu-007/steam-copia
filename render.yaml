services:
  # Backend (Spring Boot)
  - type: web
    name: steam-copia-backend
    env: java
    plan: free
    buildCommand: cd "steam copia/backend" && ./mvnw clean package -DskipTests
    startCommand: java -jar "steam copia/backend/target/backend-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JAVA_VERSION
        value: 17

  # Frontend (Flutter Web)
  - type: web
    name: steam-copia-frontend
    runtime: static
    plan: free
    publishPath: "steam copia/frontend/build/web"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
