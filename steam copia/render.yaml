services:
  # Backend (Spring Boot)
  - type: web
    name: steam-copia-backend
    env: java
    plan: free
    buildCommand: cd backend && ./mvnw clean package -DskipTests
    startCommand: java -jar backend/target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JAVA_VERSION
        value: 17

  # Frontend (Flutter Web)
  - type: web
    name: steam-copia-frontend
    env: static
    plan: free
    publishPath: frontend/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
